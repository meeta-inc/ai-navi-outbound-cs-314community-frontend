<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Integration Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .controls {
            width: 340px;
            min-width: 340px;
            padding: 20px;
            background: #fff;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .controls h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s;
            background: #fff;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
        }

        .checkbox-group label {
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background: #4a90d9;
            color: #fff;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #3a7bc8;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-top: 4px;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 10px 0;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-header h4 {
            font-size: 14px;
            color: #555;
        }

        .log-clear {
            font-size: 11px;
            color: #999;
            cursor: pointer;
            text-decoration: underline;
        }

        #logs {
            flex: 1;
            overflow-y: auto;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 11px;
            line-height: 1.6;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 8px;
            min-height: 120px;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .log-entry.ready {
            color: #2e7d32;
            font-weight: 600;
        }

        .log-entry.send {
            color: #1565c0;
        }

        .log-entry.error {
            color: #c62828;
        }

        .log-entry.info {
            color: #666;
        }

        .preview {
            flex: 1;
            padding: 0;
            display: flex;
            align-items: stretch;
        }

        .preview iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }

        .status-badge.waiting {
            background: #fff3e0;
            color: #e65100;
        }

        .status-badge.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.idle {
            background: #e0e0e0;
            color: #666;
        }

        .env-banner {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }

        .env-banner.dev {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }

        .env-banner.staging {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc80;
        }

        .env-banner.prod {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .prod-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .prod-overlay-message {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 420px;
        }

        .prod-overlay-message h2 {
            color: #c62828;
            margin-bottom: 12px;
        }

        .prod-overlay-message p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div id="envBanner" class="env-banner dev"></div>

            <h3>
                Chatbot Test Harness
                <span id="statusBadge" class="status-badge idle">Idle</span>
            </h3>

            <div class="form-group">
                <label>Target URL</label>
                <input type="text" id="targetUrl" value="http://localhost:5173" />
            </div>

            <div class="form-group">
                <label>Client ID</label>
                <select id="clientId">
                    <option value="RS000001">連成会 (RS000001)</option>
                    <option value="MM000002">名門会 (MM000002)</option>
                    <option value="AS000003">あすなろ (AS000003)</option>
                </select>
            </div>

            <div class="form-group">
                <label>App ID</label>
                <input type="text" id="appId" value="0001" />
            </div>

            <div class="form-group">
                <label>User ID</label>
                <input type="text" id="userId" value="TEST_USER_01" />
            </div>

            <div class="form-group">
                <label>Greeting Main</label>
                <input type="text" id="greetingMain" value="こんにちは！テストメッセージです。" />
            </div>

            <div class="form-group">
                <label>Greeting Sub</label>
                <input type="text" id="greetingSub" value="" placeholder="(optional)" />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="isEnableLearningNavi" />
                <label for="isEnableLearningNavi">Enable Learning Navi</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="isRequestedLearningOnboarding" />
                <label for="isRequestedLearningOnboarding">Request Learning Onboarding</label>
            </div>

            <button class="btn btn-primary" onclick="loadChatbot()">Load Chatbot</button>
            <button class="btn btn-secondary" onclick="sendManually()">Re-send INITIAL_DATA</button>

            <hr />

            <div class="log-header">
                <h4>Event Log</h4>
                <span class="log-clear" onclick="clearLogs()">Clear</span>
            </div>
            <div id="logs"></div>
        </div>

        <div class="preview">
            <iframe id="chatFrame" title="Chatbot Preview"></iframe>
        </div>
    </div>

    <script>
        // --- 환경 감지 ---
        var ALLOWED_HOSTS = [
            'localhost',
            '127.0.0.1',
            'ainavi-dev.meeta.jp',
            'ainavi-uat1.meeta.jp'
        ];

        var currentHost = window.location.hostname;
        var isAllowed = ALLOWED_HOSTS.indexOf(currentHost) !== -1;

        // 환경 배너 표시
        var envBanner = document.getElementById('envBanner');
        envBanner.className = 'env-banner ' + (isAllowed ? 'dev' : 'prod');
        envBanner.textContent = 'Host: ' + currentHost + (isAllowed ? ' (Allowed)' : ' (Blocked)');

        // 허용되지 않은 환경에서는 오버레이로 차단
        if (!isAllowed) {
            var overlay = document.createElement('div');
            overlay.className = 'prod-overlay';
            overlay.innerHTML =
                '<div class="prod-overlay-message">' +
                    '<h2>Access Denied</h2>' +
                    '<p>このテストページは許可されていない環境です。<br/>' +
                    '許可されたホスト: ' + ALLOWED_HOSTS.join(', ') + '</p>' +
                '</div>';
            document.body.appendChild(overlay);
        }

        const frame = document.getElementById('chatFrame');
        const logsEl = document.getElementById('logs');
        const statusBadge = document.getElementById('statusBadge');

        let isReady = false;

        // --- Log Utility ---
        function log(msg, type) {
            const div = document.createElement('div');
            div.className = 'log-entry ' + (type || 'info');
            const time = new Date().toLocaleTimeString();
            div.textContent = '[' + time + '] ' + msg;
            logsEl.prepend(div);
        }

        function clearLogs() {
            logsEl.innerHTML = '';
        }

        function setStatus(status) {
            statusBadge.className = 'status-badge ' + status;
            statusBadge.textContent =
                status === 'idle' ? 'Idle' :
                status === 'waiting' ? 'Waiting...' :
                status === 'connected' ? 'Connected' : status;
        }

        // --- Message Listener ---
        window.addEventListener('message', function (event) {
            var data = event.data;

            // JSON 문자열인 경우 파싱
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    // JSON이 아닌 문자열은 무시
                    return;
                }
            }

            if (!data || !data.type) return;

            if (data.type === 'READY') {
                isReady = true;
                setStatus('connected');
                log('Received READY signal from Chatbot', 'ready');
                sendInitialData();
            } else {
                log('Received message: ' + JSON.stringify(data).substring(0, 100), 'info');
            }
        });

        // --- Load Chatbot ---
        function loadChatbot() {
            if (!isAllowed) {
                log('Error: Blocked on this host', 'error');
                return;
            }

            isReady = false;
            setStatus('waiting');

            var targetUrl = document.getElementById('targetUrl').value.trim();
            if (!targetUrl) {
                log('Error: Target URL is required', 'error');
                return;
            }

            log('Loading iframe: ' + targetUrl, 'info');
            frame.src = targetUrl;
        }

        // --- Build Payload ---
        function buildPayload() {
            var greetingMain = document.getElementById('greetingMain').value.trim();
            var greetingSub = document.getElementById('greetingSub').value.trim();

            var payload = {
                clientId: document.getElementById('clientId').value.trim(),
                appId: document.getElementById('appId').value.trim(),
                userId: document.getElementById('userId').value.trim(),
                isEnableLearningNavi: document.getElementById('isEnableLearningNavi').checked,
                isRequestedLearningOnboarding: document.getElementById('isRequestedLearningOnboarding').checked
            };

            if (greetingMain) {
                payload.greeting = {
                    main: greetingMain,
                    sub: greetingSub || ''
                };
            }

            return payload;
        }

        // --- Send INITIAL_DATA ---
        function sendInitialData() {
            var payload = buildPayload();

            var message = {
                type: 'INITIAL_DATA',
                payload: payload
            };

            log('Sending INITIAL_DATA: ' + JSON.stringify(payload).substring(0, 150) + '...', 'send');

            try {
                frame.contentWindow.postMessage(JSON.stringify(message), '*');
                log('INITIAL_DATA sent successfully', 'send');
            } catch (e) {
                log('Error sending INITIAL_DATA: ' + e.message, 'error');
            }
        }

        // --- Manual Re-send ---
        function sendManually() {
            if (!frame.src || frame.src === 'about:blank') {
                log('Error: Load chatbot first', 'error');
                return;
            }

            if (!isReady) {
                log('Warning: READY not received yet. Sending anyway...', 'error');
            }

            sendInitialData();
        }
    </script>
</body>
</html>
